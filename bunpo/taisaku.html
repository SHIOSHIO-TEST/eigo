<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>テスト対策｜英語れんしゅうドリル</title>
<meta name="theme-color" content="#F1F4F6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語れんしゅう">
<style>
:root {
  --pad: 16px;
  --bg: #F1F4F6;
  --surface: #FFFFFF;
  --ink: #1C2A35;
  --muted: #5C6A75;
  --line: #D3DEE6;
  --primary: #1E5AA8;
  --primary-hover: #174B8E;
  --primary-bg: #E6EEF8;
  --accent: #C4561A;
  --accent-bg: #FCEFE5;
  --ok: #157A4B;
  --ok-bg: #E3F2E9;
  --ng: #C0333B;
  --ng-bg: #FBE9EA;
  --noun: #1E5AA8;
  --mod: #D9730D;
  --mod-bg: #FFF1E2;
  --wh: #7B4BB7;
  --wh-bg: #F1EAFA;
  --subj: #1E5AA8;
  --subj-bg: #E6EEF8;
  --verb: #C0333B;
  --verb-bg: #FBE9EA;
  --hl-bg: #FFF0B3;
  --focus: #E8A600;
  --font: "BIZ UDPGothic", "BIZ UDPゴシック", "Meiryo", "メイリオ", "Yu Gothic UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  --en: "Segoe UI", "Helvetica Neue", Arial, var(--font);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[lang="en"], .en { font-family: var(--en); }

.wrap { width: 100%; max-width: 820px; margin: 0 auto; padding: 18px var(--pad) 40px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(241, 244, 246, .94);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-bottom: 1.5px solid var(--line);
}
.topbar-in { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
.back { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .95rem; }
.back:hover { border-color: var(--primary); }
.topbar-title { flex: 1; min-width: 0; margin: 0; font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title small { display: block; font-size: .78rem; color: var(--muted); font-weight: 400; }
.topbar-count { flex: none; font-size: .95rem; color: var(--muted); }
.topbar-count b { color: var(--ink); font-size: 1.1rem; }

/* ---------- common ---------- */
h1 { font-size: 1.55rem; margin: 6px 0 4px; line-height: 1.35; }
h2 { font-size: 1.2rem; margin: 0 0 10px; }
h3 { font-size: 1.05rem; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; }
.stack > * + * { margin-top: 14px; }
.section { margin-top: 26px; }
.section-head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 1.15rem; }
.section-head .num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .9rem; flex: none; }
.chip { display: inline-block; font-size: .78rem; padding: 1px 9px; border-radius: 999px; background: var(--primary-bg); color: var(--primary); font-weight: 700; vertical-align: middle; }
.chip.accent { background: var(--accent-bg); color: var(--accent); }
.chip.gray { background: #EBEFF2; color: var(--muted); }
mark.hl { background: var(--hl-bg); color: inherit; padding: 0 2px; border-radius: 3px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; font-size: 1rem;
  background: var(--primary); color: #fff; text-decoration: none; min-height: 48px;
}
.btn:hover { background: var(--primary-hover); }
.btn.sub { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn.sub:hover { background: var(--primary-bg); }
.btn.accent { background: var(--accent); }
.btn.accent:hover { background: #A84814; }
.btn.block { width: 100%; }
.btn[disabled] { background: #E8ECEF; color: #9FA9B1; cursor: default; border-color: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.speak { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; width: 36px; height: 36px; font-size: 1rem; display: inline-grid; place-items: center; flex: none; padding: 0; }
.speak:hover { border-color: var(--primary); }
.no-speech .speak { display: none; }

/* ---------- home ---------- */
.hero { padding: 6px 0 4px; }
.hero .range { font-size: .9rem; color: var(--muted); margin: 4px 0 0; }
.total { margin-top: 14px; }
.bar { height: 10px; border-radius: 5px; background: #DCE4EA; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 5px; transition: width .3s; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; font-size: .85rem; margin: 10px 0 0; }
.flow span { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.flow em { font-style: normal; color: var(--muted); }
.lessons { display: grid; gap: 12px; margin-top: 18px; }
.lesson { display: flex; flex-direction: column; gap: 10px; }
.lesson-top { display: flex; gap: 12px; align-items: flex-start; }
.lesson-icon { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 1.5rem; background: var(--primary-bg); }
.lesson-name { margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.35; }
.lesson-sub { margin: 2px 0 0; font-size: .82rem; color: var(--muted); }
.steps-mini { display: flex; gap: 4px; flex-wrap: wrap; }
.steps-mini i { width: 22px; height: 8px; border-radius: 4px; background: #DCE4EA; }
.steps-mini i.part { background: #9CCBB2; }
.steps-mini i.done { background: var(--ok); }
.lesson .row .btn { min-height: 44px; padding: 8px 14px; }
.extra { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 16px; }
.extra .card { display: flex; flex-direction: column; gap: 8px; }
.extra p { margin: 0; }
@media (max-width: 560px) { .extra { grid-template-columns: 1fr; } }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 6px; margin: 14px 0 0; background: #E2E8ED; padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: none; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* ---------- explanation ---------- */
.scene { display: flex; gap: 12px; align-items: flex-start; }
.scene .emoji { font-size: 1.8rem; line-height: 1; flex: none; }
.scene p { margin: 0; }
.tq { margin-top: 10px; padding: 10px 12px; background: var(--primary-bg); border-radius: 10px; font-size: .95rem; }
.tq b { color: var(--primary); }
.summary { margin: 0; padding-left: 1.3em; }
.summary li + li { margin-top: 6px; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.toggle { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
.toggle[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); font-weight: 700; }

.gcard h3 { color: var(--primary); }
.gcard .point { margin: 0 0 10px; }
.gcard ul { margin: 10px 0 0; padding-left: 1.2em; font-size: .93rem; }
.gcard li + li { margin-top: 4px; }

/* diagrams */
.diag { background: #F7F9FB; border: 1px dashed #B9C8D4; border-radius: 12px; padding: 12px; overflow-x: auto; }
.diag + .diag { margin-top: 10px; }
.diag-label { font-size: .78rem; color: var(--muted); margin: 0 0 4px; font-weight: 700; }
.md-line { font-size: 1.08rem; white-space: nowrap; padding-bottom: 4px; }
.md { display: inline-flex; align-items: flex-start; position: relative; padding-bottom: 18px; vertical-align: top; }
.md-n { position: relative; color: var(--noun); font-weight: 700; border-bottom: 2.5px solid var(--noun); }
.md-n::after { content: ""; position: absolute; left: 50%; right: 0; top: calc(100% + 9px); height: 9px; border-left: 2px solid var(--mod); border-bottom: 2px solid var(--mod); }
.md-n::before { content: ""; position: absolute; left: calc(50% - 5px); top: calc(100% + 2px); border: 5px solid transparent; border-top-width: 0; border-bottom: 8px solid var(--mod); }
.md-m { position: relative; margin-left: .35em; background: var(--mod-bg); color: #8A4300; border-radius: 4px; padding: 0 4px; font-weight: 700; }
.md-m::after { content: ""; position: absolute; left: calc(-.35em - 1px); right: 50%; top: 100%; height: 18px; border-right: 2px solid var(--mod); border-bottom: 2px solid var(--mod); }
.md-ja { margin-top: 2px; font-size: .95rem; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.md-ja .mj { background: var(--mod-bg); color: #8A4300; border-radius: 4px; padding: 0 6px; font-weight: 700; }
.md-ja .nj { color: var(--noun); font-weight: 700; border-bottom: 2.5px solid var(--noun); }
.md-ja .arr { color: var(--mod); font-weight: 700; }
.md-note { font-size: .78rem; color: var(--muted); margin: 6px 0 0; }

.tok-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tok { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: 700; background: #EEF1F4; font-family: var(--en); }
.tok.w { background: var(--wh-bg); color: var(--wh); }
.tok.s { background: var(--subj-bg); color: var(--subj); }
.tok.v { background: var(--verb-bg); color: var(--verb); }
.tok.o { background: transparent; padding: 3px 2px; font-weight: 400; }
.iq-arrow { margin: 6px 0; color: var(--muted); font-size: .85rem; }
.iq-ja { font-size: .88rem; color: var(--muted); margin: 3px 0 0; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .78rem; margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.legend .w::before { background: var(--wh); }
.legend .s::before { background: var(--subj); }
.legend .v::before { background: var(--verb); }

.slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slot { border-radius: 10px; padding: 6px 10px; text-align: center; border: 2px solid; min-width: 70px; }
.slot .se { display: block; font-weight: 700; font-family: var(--en); }
.slot .sj { display: block; font-size: .8rem; }
.slot.s { border-color: #A9C1E2; background: var(--subj-bg); color: var(--subj); }
.slot.v { border-color: #EBB0B4; background: var(--verb-bg); color: var(--verb); }
.slot.w { border-color: #CDB5EA; background: var(--wh-bg); color: var(--wh); }
.slot.o { border-color: #F2C79C; background: var(--mod-bg); color: #8A4300; }

.rel-row { font-family: var(--en); font-size: 1.04rem; }
.rel-step { font-size: .78rem; color: var(--muted); margin: 8px 0 2px; font-weight: 700; font-family: var(--font); }
.rel-noun { color: var(--noun); font-weight: 700; border-bottom: 2.5px solid var(--noun); }
.rel-pron { color: var(--wh); font-weight: 700; background: var(--wh-bg); border-radius: 4px; padding: 0 4px; }
.rel-mod { background: var(--mod-bg); border-radius: 4px; padding: 0 3px; color: #8A4300; }
.rel-rp { color: var(--wh); font-weight: 800; }
.same-rows { margin: 0; padding-left: 1.2em; font-family: var(--en); }

/* figures */
.fig { overflow-x: auto; }
.fig-title { font-weight: 700; margin: 0 0 10px; }
.survey .q { display: grid; grid-template-columns: 1fr; gap: 3px; margin-bottom: 12px; }
.survey .qt { font-size: .9rem; }
.survey .qt small { display: block; color: var(--muted); font-family: var(--en); font-size: .78rem; }
.survey .qbar { display: flex; align-items: center; gap: 8px; }
.survey .qbar .track { flex: 1; height: 22px; background: #E8EDF1; border-radius: 6px; overflow: hidden; }
.survey .qbar .fill { height: 100%; background: #7FA3CF; border-radius: 6px; }
.survey .qbar .fill.max { background: var(--ok); }
.survey .qbar .fill.min { background: var(--ng); }
.survey .qbar b { width: 3.2em; text-align: right; font-size: 1.05rem; }
.survey .tag { font-size: .75rem; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.survey .tag.max { background: var(--ok-bg); color: var(--ok); }
.survey .tag.min { background: var(--ng-bg); color: var(--ng); }

.flowchart { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.fc-box { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.fc-box .fc-who { font-size: .78rem; font-weight: 700; color: var(--muted); }
.fc-box.good { border-color: #9CCBB2; background: var(--ok-bg); }
.fc-box.bad { border-color: #EBB0B4; background: var(--ng-bg); }
.fc-box.idea { border-color: #F2C79C; background: var(--mod-bg); }
.fc-box.key { border-color: #A9C1E2; background: var(--primary-bg); }
.fc-arrow { text-align: center; color: var(--muted); font-size: 1.1rem; line-height: 1.4; }
.fc-arrow small { font-size: .78rem; }
.fc-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fc-en { display: block; font-family: var(--en); font-size: .82rem; color: var(--muted); margin-top: 2px; }

.timeline { position: relative; margin: 0; padding: 0 0 0 26px; list-style: none; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 3px; background: #C9D6E0; border-radius: 2px; }
.timeline li { position: relative; padding: 0 0 14px; }
.timeline li::before { content: ""; position: absolute; left: -23px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); }
.timeline li.dark::before { border-color: var(--ng); background: var(--ng); }
.timeline li.warm::before { border-color: var(--ok); background: var(--ok); }
.timeline .when { font-size: .8rem; font-weight: 700; color: var(--primary); }
.timeline li.dark .when { color: var(--ng); }
.timeline li.warm .when { color: var(--ok); }
.timeline .what { display: block; }
.timeline .en { display: block; font-size: .82rem; color: var(--muted); }
.bridge { display: flex; align-items: center; justify-content: center; gap: 0; margin: 4px 0 14px; }
.bridge .land { border: 2px solid var(--primary); border-radius: 10px; padding: 6px 12px; font-weight: 700; background: var(--primary-bg); color: var(--primary); }
.bridge svg { width: 150px; height: 46px; flex: none; }

.profile { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; }
.profile dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: .95rem; }
.profile dt { font-weight: 700; color: var(--muted); white-space: nowrap; }
.profile dd { margin: 0; }
@media (max-width: 520px) { .profile { grid-template-columns: 1fr; } .profile svg { max-width: 220px; margin: 0 auto; display: block; } }

.six { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.six > div { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: .92rem; }
.six b { color: var(--accent); }
.six .ex { display: block; font-family: var(--en); font-size: .88rem; }
.order { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.order .lab { font-size: .8rem; font-weight: 700; color: var(--muted); }

/* sentence cards */
.sent { padding: 14px 14px 12px; }
.sent-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sent-no { font-size: .8rem; font-weight: 700; color: var(--muted); }
.sent-sp { font-size: .8rem; font-weight: 700; background: #EEF1F4; border-radius: 6px; padding: 0 7px; }
.sent-en { font-size: 1.18rem; line-height: 1.55; margin: 0; flex: 1; }
.sent-top { display: flex; gap: 10px; align-items: flex-start; }
.chunks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chunk { border: 1.5px solid #C9D6E0; border-radius: 9px; padding: 4px 9px; background: #F7F9FB; }
.chunk .ce { display: block; font-family: var(--en); font-weight: 700; font-size: .98rem; }
.chunk .cj { display: block; font-size: .82rem; color: var(--muted); }
.chunk + .chunk { position: relative; }
.sent-ja { margin: 10px 0 0; font-size: 1rem; }
.sent-nt { margin: 8px 0 0; font-size: .9rem; background: var(--hl-bg); border-radius: 8px; padding: 6px 10px; }
.sent .diag { margin-top: 10px; }
.para-label { font-weight: 700; color: var(--accent); margin: 18px 0 8px; font-size: .95rem; }
.hide-chunks .chunks { display: none; }
.hide-ja .jaw { filter: blur(6px); cursor: pointer; user-select: none; }
.hide-ja .jaw.show { filter: none; }

.passage-read p { margin: 0 0 10px; }
.passage-read .pen { font-family: var(--en); font-size: 1.05rem; line-height: 1.8; }
.passage-read .pja { font-size: .9rem; color: var(--muted); margin-top: 2px; }
.line-sp { font-weight: 700; font-size: .85rem; color: var(--muted); margin-right: 6px; }

.vocab { width: 100%; border-collapse: collapse; }
.vocab td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.vocab td:first-child { font-family: var(--en); font-weight: 700; }
.vocab td:last-child { width: 44px; text-align: right; }

/* practice menu */
.steplist { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
.step-no { width: 44px; height: 44px; border-radius: 12px; background: var(--primary-bg); color: var(--primary); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
.step.done .step-no { background: var(--ok); color: #fff; }
.step-name { margin: 0; font-weight: 700; }
.step-desc { margin: 0; font-size: .82rem; color: var(--muted); }
.step .bar { margin-top: 6px; height: 7px; }
.step .btn { min-height: 44px; padding: 8px 16px; }

/* play */
.play { padding-bottom: 20px; }
.qcard { margin-top: 6px; }
.qkind { font-size: .82rem; font-weight: 700; color: var(--accent); margin: 0 0 6px; }
.qprompt { font-size: 1.3rem; line-height: 1.6; margin: 0; word-break: break-word; }
.qprompt.ja-prompt { font-size: 1.2rem; }
.qsub { margin: 8px 0 0; color: var(--muted); font-size: .98rem; }
.qtop { display: flex; gap: 10px; align-items: flex-start; }
.qtop .qprompt { flex: 1; }
.blank { display: inline-block; min-width: 3.5em; border-bottom: 3px solid var(--primary); text-align: center; color: var(--primary); font-weight: 700; padding: 0 4px; line-height: 1.3; }
.blank.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); border-radius: 4px 4px 0 0; }
.blank.ng { border-color: var(--ng); color: var(--ng); background: var(--ng-bg); border-radius: 4px 4px 0 0; }
.blank.cur { background: #FFF6CF; border-color: var(--focus); color: #8A6400; border-radius: 4px 4px 0 0; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { background: #FFE88A; } }
@media (prefers-reduced-motion: reduce) { .blank.cur { animation: none; } }
.target { background: var(--mod-bg); color: #8A4300; font-weight: 700; border-bottom: 3px solid var(--mod); padding: 0 3px; border-radius: 3px; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.choices.long { grid-template-columns: 1fr; }
@media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
.choice {
  display: flex; align-items: center; gap: 10px; text-align: left;
  min-height: 56px; padding: 10px 14px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--surface);
  font-size: 1.12rem; line-height: 1.4;
}
.choice:hover:not([disabled]) { border-color: var(--primary); background: #F6F9FD; }
.choice .k { flex: none; width: 26px; height: 26px; border-radius: 7px; background: #EEF1F4; color: var(--muted); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.choice .t { flex: 1; word-break: break-word; }
.choice.is-ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.choice.is-ng { border-color: var(--ng); background: var(--ng-bg); color: var(--ng); }
.choice.is-ng .t { text-decoration: line-through; }

        say: en,
        correct, choices: shuffle([correct, ...wrong]), choiceEn: it.dir !== "e",
        ex: `<span lang="en"><b>${esc(en)}</b></span> ＝ ${esc(ja)}`
      };
    }
    if (it.kind === "c") {
      const s = L.sentences[it.si];
      const ch = chunksOf(s);
      const correct = s.cj[it.ci];
      const others = [];
      L.sentences.forEach((t, ti) => { if (ti !== it.si) t.cj.forEach(x => others.push(x)); });
      let wrong = pick3(correct, others);
      if (wrong.length < 3) wrong = wrong.concat(pick3(correct, s.cj.filter(x => !wrong.includes(x)))).slice(0, 3);
      const html = ch.map((c, ci) => ci === it.ci ? `<span class="target">${esc(plain(c))}</span>` : esc(plain(c))).join(" ");
      return {
        label: "色のついた部分の意味は？",
        prompt: `<span lang="en">${html}</span>`,
        say: plain(s.en),
        correct, choices: shuffle([correct, ...wrong]),
        ex: `<span lang="en"><b>${esc(plain(ch[it.ci]))}</b></span> ＝ ${esc(correct)}`,
        full: chunkStrip(s), ja: s.ja
      };
    }
    if (it.kind === "s") {
      const s = L.sentences[it.si];
      const b = sentenceBlank(s, it.qi);
      const correct = b.q[0];
      return {
        label: "空らんに入るのは？",
        prompt: `<span lang="en">${esc(b.before)}<span class="blank" id="qblank">　</span>${esc(b.after)}</span>`,
        sub: esc(s.ja),
        say: b.text,
        blank: true,
        correct, choices: shuffle(b.q.slice(0, 4)), choiceEn: true,
        ex: rich(b.q[4] || s.nt),
        source: `${L.unit} ${L.part}`
      };
    }
    if (it.kind === "k") {
      const c = L.content[it.i];
      return {
        label: "内容チェック",
        prompt: esc(c.q), promptJa: !/^[A-Za-z]/.test(c.q),
        correct: c.c[0], choices: shuffle(c.c), choiceEn: /^[A-Za-z]/.test(c.c[0]),
        ex: c.ex ? `本文：<span lang="en">${esc(c.ex)}</span>` : ""
      };
    }
    if (it.kind === "d") {
      const d = L.drills[it.n], q = d.qs[it.i];
      const html = esc(q.p).replace(/\[\[(.+?)\]\]/g, '<span class="target">$1</span>').replace(/___/g, '<span class="blank" id="qblank">　</span>');
      const isJa = /[ぁ-んァ-ン一-龥]/.test(q.p);
      return {
        label: d.name,
        prompt: isJa ? html : `<span lang="en">${html}</span>`, promptJa: isJa,
        sub: q.ja ? esc(q.ja) : "",
        blank: /___/.test(q.p),
        correct: q.c[0], choices: shuffle(q.c), choiceEn: true,
        long: q.c.some(x => x.length > 22),
        ex: rich(q.ex),
        say: isJa ? q.c[0] : q.p.replace(/\[\[|\]\]/g, "").replace("___", q.c[0])
      };
    }
    return null;
  }

  function diagMd(d) {

  function tokRow(toks) { return `<div class="tok-row" lang="en">${toks.map(([t, r]) => `<span class="tok ${r}">${esc(t)}</span>`).join("")}</div>`; }
  function diagIq(d) {

  function diagSame(d) {
    return `<div class="diag">${d.title ? `<p class="diag-label">${esc(d.title)}</p>` : ""}<ul class="same-rows">${d.rows.map(r => `<li>${rich(r)}</li>`).join("")}</ul></div>`;
  }
  function renderDiag(d) {
    return ({ md: diagMd, iq: diagIq, slot: diagSlot, rel: diagRel, same: diagSame }[d.type] || (() => ""))(d);
  }
  function chunkStrip(s) {
    return `<div class="chunks">${chunksOf(s).map((c, i) => `<div class="chunk"><span class="ce" lang="en">${rich(c)}</span><span class="cj">${esc(s.cj[i] || "")}</span></div>`).join("")}</div>`;

    app.innerHTML = `<div class="wrap">${lineBanner()}<p style="margin:0 0 8px"><a class="back" href="./" style="text-decoration:none;display:inline-block">← 文法ドリルにもどる</a></p>${switcher}

      <div class="card total"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>ぜんたいの進み具合</b><span><b style="font-size:1.3rem">${pct}</b>%</span></div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
      <div class="flow"><em>進め方：</em><span>📖 解説</span><em>→</em><span>単語</span><em>→</em><span>かたまり</span><em>→</em><span>1文</span><em>→</em><span>2〜3文</span><em>→</em><span>本文</span><em>→</em><span>内容</span><em>→</em><span>🏁 総まとめ</span></div></div></section>
      <div class="lessons">${cards}</div>
      <div class="extra"><div class="card"><h2>🏁 総まとめテスト</h2><p class="small muted">全部の単元から20問。100点をめざそう！${state.testBest != null ? `<br>これまでの最高：<b>${state.testBest}点</b>` : ""}</p><a class="btn accent" href="#/test">テストを始める</a></div>
      <div class="card"><h2>🔁 まちがえた問題</h2><p class="small muted">いま <b>${state.mistakes.length}</b> 問。正解すると消えます。</p><a class="btn sub${state.mistakes.length ? "" : " off"}" href="#/review" ${state.mistakes.length ? "" : 'aria-disabled="true"'}>復習する</a></div></div>
    </div>`;
  }

  /* ---------------- lesson: explanation ---------------- */
  function renderLesson(L, tab) {
    setTop({ back: "#/", title: esc(L.title), sub: `${esc(L.unit)} ${esc(L.part)}　${esc(L.page)}` });
    const tabs = `<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab === "read"}" data-go="#/l/${L.id}">📖 解説</button><button role="tab" aria-selected="${tab === "practice"}" data-go="#/l/${L.id}/p">✏️ 練習</button></div>`;
    app.innerHTML = `<div class="wrap">${tabs}<div id="tabBody"></div></div>`;
    const body = $("#tabBody");
    if (tab === "practice") { body.innerHTML = practiceMenu(L); return; }
    body.innerHTML = explanation(L);
    body.classList.toggle("hide-ja", state.hideJa);
    body.classList.toggle("hide-chunks", state.hideChunks);
  }
  function explanation(L) {
    let n = 0;
    const secNum = () => `<span class="num">${++n}</span>`;
    let html = `<div class="section" style="margin-top:16px"><div class="card"><div class="scene"><span class="emoji" aria-hidden="true">${L.icon || ICON[L.id] || "📘"}</span><p>${esc(L.scene)}</p></div>
      ${L.question ? `<div class="tq">❓ <b lang="en">${esc(L.question[0])}</b><br>${esc(L.question[1])}</div>` : ""}</div></div>`;
    html += `<div class="section"><h2 class="section-head">${secNum()}まずはざっくり内容をつかもう</h2><div class="card"><ul class="summary">${L.summary.map(s => `<li>${rich(s)}</li>`).join("")}</ul></div>
      ${L.figHtml ? `<div class="card fig" style="margin-top:12px">${L.figHtml}</div>` : FIG[L.fig] ? `<div style="margin-top:12px">${FIG[L.fig]()}</div>` : ""}</div>`;
    html += `<div class="section"><h2 class="section-head">${secNum()}文法のポイント</h2><div class="stack">${L.grammar.map(g => `<div class="card gcard"><h3>${esc(g.t)}</h3><p class="point">${rich(g.p)}</p>${(g.d || []).map(renderDiag).join("")}${g.tips && g.tips.length ? `<ul>${g.tips.map(t => `<li>${rich(t)}</li>`).join("")}</ul>` : ""}</div>`).join("")}</div></div>`;

    // sentence by sentence
    const toggles = `<div class="toggles"><button type="button" class="toggle" data-toggle="chunks" aria-pressed="${!state.hideChunks}">かたまり表示</button><button type="button" class="toggle" data-toggle="ja" aria-pressed="${state.hideJa}">日本語をかくす（タップで表示）</button></div>`;
    let cards = "", pi = 0, inPara = 0, ksStarted = false, no = 0;
    const paraLabel = L.paras ? (i => `段落 ${L.paraStart + i}`) : null;
    L.sentences.forEach((s, si) => {
      if (s.ks && !ksStarted) { ksStarted = true; cards += `<p class="para-label">📌 教科書の Key Sentence・Practice の文</p>`; }
      if (!s.ks && paraLabel) { if (inPara === 0) cards += `<p class="para-label">${paraLabel(pi)}</p>`; inPara++; if (inPara === L.paras[pi]) { pi++; inPara = 0; } }
      no++;
      const md = s.md ? diagMd({ before: s.md[0], n: s.md[1], m: s.md[2], after: s.md[3], nj: s.md[4], mj: s.md[5] }) : "";
      cards += `<div class="card sent"><div class="sent-head"><span class="sent-no">${no}</span>${s.sp ? `<span class="sent-sp">${esc(s.sp)}</span>` : ""}${s.ks ? `<span class="chip accent">${esc(s.ks)}</span>` : ""}</div>
        <div class="sent-top"><p class="sent-en" lang="en">${rich(plain(s.en).length ? s.en.replace(/ \/ /g, " ") : "")}</p>${spk(plain(s.en))}</div>
        ${chunkStrip(s)}<p class="sent-ja"><span class="jaw">${esc(s.ja)}</span></p>${s.nt ? `<p class="sent-nt">💡 ${rich(s.nt)}</p>` : ""}${md}</div>`;
    });
    html += `<div class="section"><h2 class="section-head">${secNum()}1文ずつ読もう</h2><p class="small muted" style="margin:0 0 8px">英文を「意味のかたまり」に分けて、前から順番に意味をとろう。🔊で発音も聞けます。</p>${toggles}<div class="stack" style="margin-top:12px">${cards}</div></div>`;

    // through-reading
    if (L.passage !== false) {
      html += `<div class="section"><h2 class="section-head">${secNum()}通して読もう</h2><div class="card passage-read">${throughText(L)}</div></div>`;
    }
    html += `<div class="section"><h2 class="section-head">${secNum()}単語・熟語</h2><div class="card"><table class="vocab">${L.vocab.map(([e, j]) => `<tr><td lang="en">${esc(e)}</td><td>${esc(j)}</td><td>${spk(e)}</td></tr>`).join("")}</table></div></div>`;
    html += `<div class="section"><a class="btn block" href="#/l/${L.id}/p">✏️ この単元の練習へ進む</a></div>`;
    return html;
  }
  function throughText(L) {
    const body = bodySentences(L);
    let out = "", i = 0;
    if (L.paras) {
      L.paras.forEach((n, p) => {
        const part = body.slice(i, i + n); i += n;
        out += `<p class="para-label" style="margin-top:${p ? 14 : 0}px">段落 ${L.paraStart + p}</p><p><span class="pen" lang="en">${part.map(x => esc(plain(x.s.en))).join(" ")}</span><span class="pja jaw" style="display:block">${part.map(x => esc(x.s.ja)).join("")}</span></p>`;
      });
      return out;
    }
    // dialog or plain list: merge consecutive lines by same speaker
    const lines = [];
    body.forEach(x => { const last = lines[lines.length - 1]; if (last && x.s.sp && last.sp === x.s.sp) last.items.push(x.s); else lines.push({ sp: x.s.sp, items: [x.s] }); });
    return lines.map(l => `<p>${l.sp ? `<span class="line-sp">${esc(l.sp)}:</span>` : ""}<span class="pen" lang="en">${l.items.map(s => esc(plain(s.en))).join(" ")}</span><span class="pja jaw" style="display:block">${l.items.map(s => esc(s.ja)).join("")}</span></p>`).join("");
  }

  /* ---------------- lesson: practice menu ---------------- */
  function practiceMenu(L) {
    const steps = stepsFor(L);
    return `<p class="small muted" style="margin:14px 0 10px">上から順番がおすすめ。1回10問くらい。一発で正解した問題が「クリア」になります。</p><div class="steplist">${steps.map((st, i) => {
      const p = stepProgress(L, st.id); const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
      const best = state.best[L.id + "|" + st.id];
      return `<div class="card step${p.done >= p.total ? " done" : ""}"><div class="step-no">${p.done >= p.total ? "✓" : i + 1}</div>
        <div><p class="step-name">${esc(st.name)}</p><p class="step-desc">${esc(st.desc)}<br>クリア ${p.done} / ${p.total}${best != null ? `　最高 ${best}%` : ""}</p><div class="bar"><i style="width:${pct}%"></i></div></div>
        <a class="btn" href="#/play/${L.id}/${st.id}">${p.done ? "つづける" : "スタート"}</a></div>`;
    }).join("")}</div>
    <div class="section"><a class="btn sub block" href="#/l/${L.id}">📖 解説にもどる</a></div>`;
  }

  /* ---------------- play engine ---------------- */
  let run = null;
  function pickRun(items, n, ordered) {
    const un = items.filter(it => !state.cleared[it.key]);
    const cl = items.filter(it => state.cleared[it.key]);
    let sel = shuffle(un).slice(0, n);
    if (sel.length < n) sel = sel.concat(shuffle(cl).slice(0, n - sel.length));
    if (ordered) sel.sort((a, b) => a.idx - b.idx);
    return sel;
  }
  function startRun(mode, L, step) {
    let items, title, back, sub;
    if (mode === "lesson") {
      const st = stepsFor(L).find(s => s.id === step);
      if (!st) { location.hash = "#/l/" + L.id + "/p"; return; }
      const all = itemsFor(L, step);
      const size = RUN_SIZE[step[0] === "d" ? "d" : step] || 10;
      items = pickRun(all, size, step === "c" || step === "s" || step === "g");
      title = st.name; sub = `${L.title}（${L.unit} ${L.part}）`; back = `#/l/${L.id}/p`;
    } else if (mode === "review") {
      items = state.mistakes.map(itemByKey).filter(Boolean).slice(0, 10);
      title = "まちがえた問題の復習"; back = "#/";
    } else if (mode === "test") {
      items = buildTest(); title = "総まとめテスト"; back = "#/";
    }
    if (!items || !items.length) { location.hash = back || "#/"; return; }
    run = { mode, L, step, title, sub, back, queue: items.slice(), total: items.length, answered: 0, firstOk: 0, retried: new Set(), wrongLessons: {}, blanksTotal: 0, blanksOk: 0 };
    if (step === "g" || step === "w") { run.passages = items; run.pIndex = 0; startPassage(); }
    else nextQ();
  }
  function buildTest() {
    const pools = { v: [], s: [], k: [], d: [] };
    for (const L of LESSONS) {
      pools.v.push(...itemsFor(L, "v"));
      L.sentences.forEach((s, si) => s.q.forEach((q, qi) => pools.s.push({ key: `s:${L.id}:${si}:${qi}`, kind: "s", L, si, qi })));
      pools.k.push(...itemsFor(L, "k"));
      (L.drills || []).forEach((d, n) => pools.d.push(...itemsFor(L, "d" + n)));
    }
    return shuffle([].concat(shuffle(pools.v).slice(0, 5), shuffle(pools.s).slice(0, 7), shuffle(pools.k).slice(0, 4), shuffle(pools.d).slice(0, 4)));
  }

  /* ----- single question ----- */
  function nextQ() {
    if (!run.queue.length) return showResult();
    const it = run.queue.shift();
    const q = makeQ(it);
    run.cur = { it, q, answered: false, retry: run.retried.has(it.key) };
    setTop({ back: run.back, title: esc(run.title), sub: run.sub ? esc(run.sub) : "", right: `<b>${Math.min(run.answered + 1, run.total)}</b> / ${run.total}` });
    const longChoices = q.long || q.choices.some(c => c.length > 16);
    app.innerHTML = `<div class="wrap play"><div class="card qcard">
      <p class="qkind">${esc(q.label)}${run.cur.retry ? '　<span class="chip gray">もう一度</span>' : ""}${q.source && run.mode !== "lesson" ? `　<span class="chip gray">${esc(q.source)}</span>` : ""}</p>
      <div class="qtop"><p class="qprompt${q.promptJa ? " ja-prompt" : ""}">${q.prompt}</p>${q.say && !q.promptJa ? spk(q.say) : ""}</div>
      ${q.sub ? `<p class="qsub">${q.sub}</p>` : ""}</div>
      <div class="choices${longChoices ? " long" : ""}" id="choices">${q.choices.map((c, i) => `<button type="button" class="choice" data-choice="${i}"><span class="k">${i + 1}</span><span class="t"${q.choiceEn ? ' lang="en"' : ""}>${esc(c)}</span></button>`).join("")}</div>
      <div id="fb"></div></div>`;
    window.scrollTo(0, 0);
  }
  function answerQ(i) {
    const cur = run.cur; if (!cur || cur.answered) return;
    cur.answered = true;
    const q = cur.q, it = cur.it;
    const choice = q.choices[i];
    const ok = choice === q.correct;
    $$(".choice").forEach((b, bi) => {
      b.disabled = true;
      if (q.choices[bi] === q.correct) b.classList.add("is-ok");
      else if (bi === i) b.classList.add("is-ng");
      else b.classList.add("dim");
    });
    const bl = $("#qblank");
    if (bl) { bl.textContent = q.correct; bl.classList.add(ok ? "ok" : "ng"); }
    if (!cur.retry) {
      run.answered++;
      if (ok) run.firstOk++;
    }
    if (ok) {
      if (!cur.retry && run.mode === "lesson") state.cleared[it.key] = true;
      if (run.mode === "review") removeMistake(it.key);
    } else {
      addMistake(it.key);
      run.wrongLessons[it.L.id] = (run.wrongLessons[it.L.id] || 0) + 1;
      if (run.mode !== "test" && !run.retried.has(it.key)) { run.retried.add(it.key); run.queue.push(it); }
    }
    save();
    const praise = ["せいかい！", "いいね！", "その調子！", "ばっちり！"][Math.floor(Math.random() * 4)];
    const fullS = it.kind === "s" ? `<p class="fb-full" lang="en">${esc(sentenceBlank(it.L.sentences[it.si], it.qi).text)}</p>` : "";
    $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "ng"}" aria-live="polite"><p class="fb-title">${ok ? "⭕ " + praise : `❌ 正解は「<span${q.choiceEn ? ' lang="en"' : ""}>${esc(q.correct)}</span>」`}</p>
      ${q.ex ? `<p class="fb-body">${q.ex}</p>` : ""}${fullS}${q.full ? q.full : ""}${q.ja && it.kind === "c" ? `<p class="fb-ja">${esc(q.ja)}</p>` : ""}
      ${!ok && run.mode !== "test" && !cur.retry ? '<p class="small muted" style="margin:6px 0 0">この問題は、あとでもう一度出ます。</p>' : ""}</div>
      <div class="next-row"><button type="button" class="btn" id="nextBtn" data-next>${run.queue.length ? "次へ" : "結果を見る"} ▶</button></div>`;
    const nb = $("#nextBtn"); if (nb) nb.focus({ preventScroll: true });
    $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ----- passage (2〜3文 / 本文) ----- */
  function startPassage() {
    const it = run.passages[run.pIndex];
    const L = it.L;
    const segs = it.sis.map(si => {
      const s = L.sentences[si];
      let qi = null;
      if (s.q.length) qi = run.step === "g" ? (s.q[1] ? 1 : 0) : Math.floor(Math.random() * s.q.length);
      return { si, s, qi };
    });
    const blanks = segs.filter(x => x.qi !== null).map((x, n) => ({ ...x, n: n + 1, b: sentenceBlank(x.s, x.qi), choices: shuffle(x.s.q[x.qi].slice(0, 4)), state: "" }));
    run.pas = { it, segs, blanks, cur: 0, firstOkAll: true, okCount: 0, showJa: false, done: false };
    drawPassage(true);
  }
  function passageHTML() {
    const P = run.pas, L = P.it.L;
    const bmap = new Map(P.blanks.map(b => [b.si, b]));
    let lines = [], pi = 0;
    // paragraph grouping for long texts
    const paraBreaks = new Set();
    if (L.paras) { let acc = 0; const body = bodySentences(L).map(x => x.si); L.paras.forEach((n, i) => { paraBreaks.add(body[acc]); acc += n; }); }
    let curLine = null;
    P.segs.forEach(seg => {
      const b = bmap.get(seg.si);
      let html;
      if (b) {
        const st = b.state || (P.cur === b.n - 1 && !P.done ? "cur" : "");
        const inner = b.state ? esc(b.b.q[0]) : `（${b.n}）`;
        html = `${esc(b.b.before)}<span class="blank ${st}" data-bn="${b.n}">${inner}</span>${esc(b.b.after)}`;
      } else html = esc(plain(seg.s.en));
      const newLine = !curLine || (seg.s.sp ? seg.s.sp !== curLine.sp : (L.paras ? paraBreaks.has(seg.si) : true));
      if (newLine) { curLine = { sp: seg.s.sp, para: paraBreaks.has(seg.si) ? (L.paraStart + pi++) : null, parts: [], ja: [] }; lines.push(curLine); }
      curLine.parts.push(html); curLine.ja.push(seg.s.ja);
    });
    return lines.map(l => `${l.para != null && run.step === "w" ? `<p class="para-label" style="margin:10px 0 2px">段落 ${l.para}</p>` : ""}<p class="pline">${l.sp ? `<span class="line-sp">${esc(l.sp)}:</span>` : ""}<span lang="en">${l.parts.join(" ")}</span>${P.showJa ? `<span class="pja">${esc(l.ja.join(""))}</span>` : ""}</p>`).join("");
  }
  function drawPassage(first) {
    const P = run.pas;
    const label = run.step === "g" ? `文章 ${run.pIndex + 1} / ${run.passages.length}` : "本文まるごと";
    setTop({ back: run.back, title: esc(run.title), sub: esc(run.sub || ""), right: `<b>${Math.min(P.cur + 1, P.blanks.length)}</b> / ${P.blanks.length}` });
    const b = P.blanks[P.cur];
    const dock = P.done ? `<div class="dock"><div class="feedback ${P.firstOkAll ? "ok" : "ng"}"><p class="fb-title">${P.okCount} / ${P.blanks.length} 問 正解${P.firstOkAll ? "　🎉 パーフェクト！" : ""}</p><p class="fb-body small">日本語訳を表示して、もう一度読んでみよう。</p></div>
        <div class="next-row"><button type="button" class="btn" data-pnext>${run.pIndex + 1 < run.passages.length ? "次の文章へ ▶" : "結果を見る ▶"}</button></div></div>`
      : `<div class="dock"><p class="dock-q">（${b.n}）に入るのは？</p><div class="choices${b.choices.some(c => c.length > 14) ? " long" : ""}" id="choices">${b.choices.map((c, i) => `<button type="button" class="choice" data-pchoice="${i}"><span class="k">${i + 1}</span><span class="t" lang="en">${esc(c)}</span></button>`).join("")}</div><div id="pfb"></div></div>`;
    app.innerHTML = `<div class="wrap play"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><p class="qkind" style="margin:0">${label}</p>
      <button type="button" class="toggle" data-pja aria-pressed="${P.showJa}">日本語訳${P.showJa ? "をかくす" : "を見る"}</button></div>
      <div class="passage" id="passage" style="margin-top:8px">${passageHTML()}</div></div>${dock}</div>`;
    if (first) window.scrollTo(0, 0);
    const curEl = $(".blank.cur");
    if (curEl && !first) curEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function answerPassage(i) {
    const P = run.pas; const b = P.blanks[P.cur];
    if (!b || b.state) return;
    const choice = b.choices[i]; const ok = choice === b.b.q[0];
    b.state = ok ? "ok" : "ng";
    run.blanksTotal++;
    if (ok) { P.okCount++; run.blanksOk++; } else { P.firstOkAll = false; addMistake(`s:${P.it.L.id}:${b.si}:${b.qi}`); run.wrongLessons[P.it.L.id] = (run.wrongLessons[P.it.L.id] || 0) + 1; }
    save();
    $$("#choices .choice").forEach((el, bi) => { el.disabled = true; if (b.choices[bi] === b.b.q[0]) el.classList.add("is-ok"); else if (bi === i) el.classList.add("is-ng"); else el.classList.add("dim"); });
    const blankEl = $(`.blank[data-bn="${b.n}"]`);
    if (blankEl) { blankEl.textContent = b.b.q[0]; blankEl.className = "blank " + b.state; }
    const ex = b.b.q[4] || b.s.nt;
    $("#pfb").innerHTML = `<div class="feedback ${ok ? "ok" : "ng"}"><p class="fb-title">${ok ? "⭕ せいかい！" : `❌ 正解は「<span lang="en">${esc(b.b.q[0])}</span>」`}</p>${ex ? `<p class="fb-body small">${rich(ex)}</p>` : ""}${!ok ? `<p class="fb-ja">${esc(b.s.ja)}</p>` : ""}</div>
      <div class="next-row"><button type="button" class="btn" data-pgo>次へ ▶</button></div>`;
    const nb = $("[data-pgo]"); if (nb) nb.focus({ preventScroll: true });
  }
  function passageAdvance() {
    const P = run.pas;
    P.cur++;
    if (P.cur >= P.blanks.length) {
      P.done = true;
      const it = P.it;
      const pct = P.okCount / P.blanks.length;
      if (run.step === "g" ? P.firstOkAll : pct >= 0.8) state.cleared[it.key] = true;
      run.answered++; if (P.firstOkAll) run.firstOk++;
      save();
    }
    drawPassage(false);
  }

  /* ----- result ----- */
  function showResult() {
    const isPassage = run.step === "g" || run.step === "w";
    const total = isPassage ? run.blanksTotal : run.total;
    const ok = isPassage ? run.blanksOk : run.firstOk;
    const pct = total ? Math.round(ok / total * 100) : 0;
    if (run.mode === "lesson") {
      const k = run.L.id + "|" + run.step;
      state.best[k] = Math.max(state.best[k] || 0, pct);
    }
    if (run.mode === "test") state.testBest = Math.max(state.testBest || 0, pct);
    save();
    const stars = pct >= 90 ? "★★★" : pct >= 70 ? "★★☆" : pct >= 40 ? "★☆☆" : "☆☆☆";
    const msg = pct === 100 ? "パーフェクト！すばらしい！" : pct >= 80 ? "よくできました！あと少しで全部クリア！" : pct >= 50 ? "いい調子！まちがえたところを解説で確認しよう。" : "大丈夫、くり返せば必ず覚えられる！解説を見てからもう一度。";
    let actions = "", extra = "";
    if (run.mode === "lesson") {
      const steps = stepsFor(run.L); const idx = steps.findIndex(s => s.id === run.step); const nxt = steps[idx + 1];
      const p = stepProgress(run.L, run.step);
      extra = `<p class="small muted">このステップのクリア：${p.done} / ${p.total}</p>`;
      actions = `<button type="button" class="btn" data-again>🔁 もう一度</button>${nxt ? `<a class="btn sub" href="#/play/${run.L.id}/${nxt.id}">次：${esc(nxt.name)} ▶</a>` : `<a class="btn sub" href="#/test">🏁 総まとめテストへ</a>`}<a class="btn sub" href="#/l/${run.L.id}">📖 解説を見る</a>`;
    } else if (run.mode === "test") {
      const weak = Object.entries(run.wrongLessons).sort((a, b) => b[1] - a[1]);
      extra = weak.length ? `<div class="card weak"><b>復習するとよい単元</b><ul>${weak.map(([id, n]) => { const L = LMAP.get(id); return `<li><a href="#/l/${id}">${esc(L.title)}（${esc(L.unit)} ${esc(L.part)}）</a>　${n}問まちがい</li>`; }).join("")}</ul></div>` : "";
      actions = `<button type="button" class="btn" data-again>🔁 もう一度テスト</button><a class="btn sub" href="#/">🏠 ホーム</a>`;
    } else {
      extra = `<p class="small muted">のこりの「まちがえた問題」：${state.mistakes.length} 問</p>`;
      actions = `${state.mistakes.length ? '<button type="button" class="btn" data-again>🔁 続けて復習</button>' : ""}<a class="btn sub" href="#/">🏠 ホーム</a>`;
    }
    setTop({ back: run.back, title: esc(run.title), sub: "結果" });
    app.innerHTML = `<div class="wrap"><div class="card result"><p class="muted" style="margin:0">${run.mode === "test" ? "得点" : isPassage ? "正解した空らん" : "一発で正解"}</p>
      <p class="big">${run.mode === "test" ? `${pct}<span style="font-size:1.2rem">点</span>` : `${ok}<span style="font-size:1.2rem"> / ${total}</span>`}</p>
      <p class="stars" aria-label="評価">${stars}</p><p class="msg">${msg}</p>${extra}<div class="row" style="margin-top:12px">${actions}</div></div></div>`;
    window.scrollTo(0, 0);
  }

  /* ---------------- install / LINE ---------------- */
  const isLine = /Line\//i.test(navigator.userAgent);
  function externalUrl() { const u = new URL(location.href); u.searchParams.set("openExternalBrowser", "1"); return u.toString(); }
  function lineBanner() {
    if (!isLine) return "";
    return `<div class="banner">LINE の中で開いています。学習の記録を残すために、Safari / Chrome で開きなおしてください。<br><a class="btn" href="${esc(externalUrl())}">Safari / Chrome で開きなおす</a></div>`;
  }
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; const b = $("#installNow"); if (b) b.hidden = false; });
  function openInstall() {
    const ua = navigator.userAgent;
    const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const m = ua.match(/OS (\d+)_/); const iosVer = m ? +m[1] : 0;
    const iosNew = `<h3>iPhone（iOS 26 以降の Safari）</h3><ol><li>画面右下の「…」→「共有」をタップ</li><li>「ホーム画面に追加」をタップ（見つからなければ下にスクロール）</li><li>「Web アプリとして開く」がオンのまま、右上の「追加」</li></ol>`;
    const iosOld = `<h3>iPhone（iOS 18 以前の Safari）</h3><ol><li>画面下の共有ボタン（四角から↑が出たマーク）をタップ</li><li>下にスクロールして「ホーム画面に追加」</li><li>右上の「追加」</li></ol>`;
    const android = `<h3>Android（Chrome）</h3><button type="button" class="btn" id="installNow" ${deferredPrompt ? "" : "hidden"}>📲 ホーム画面に追加する</button><ol><li>右上の「⋮」をタップ</li><li>「ホーム画面に追加」または「アプリをインストール」</li><li>「インストール」</li></ol>`;
    const body = ios ? (iosVer >= 26 ? iosNew + iosOld : iosOld + iosNew) : android + iosNew + iosOld;
    $("#sheetBody").innerHTML = `${body}<p class="small muted">追加したら、次からはホーム画面のアイコンから開いてください（iPhone は Safari とアイコンで学習記録が別々になります）。</p>`;
    $("#sheet").hidden = false;
  }

  /* ---------------- router ---------------- */
  function route() {
    if (typeof speechSynthesis !== "undefined" && canSpeak) speechSynthesis.cancel();
    const h = location.hash.replace(/^#\/?/, "").split("/");
    if (h[0] === "l" && LMAP.get(h[1])) { run = null; renderLesson(LMAP.get(h[1]), h[2] === "p" ? "practice" : "read"); window.scrollTo(0, 0); return; }
    if (h[0] === "play" && LMAP.get(h[1])) return startRun("lesson", LMAP.get(h[1]), h[2]);
    if (h[0] === "test") return startRun("test");
    if (h[0] === "review") { if (!state.mistakes.length) { location.hash = "#/"; return; } return startRun("review"); }
    run = null; renderHome(); window.scrollTo(0, 0);
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-go],[data-test],[data-speak],[data-choice],[data-next],[data-pchoice],[data-pgo],[data-pnext],[data-pja],[data-toggle],[data-again],.jaw,#installNow,[aria-disabled]");
    if (!t) return;
    if (t.hasAttribute("aria-disabled")) { e.preventDefault(); return; }
    if (t.dataset.go) { location.hash = t.dataset.go; return; }
    if (t.dataset.test) { try { localStorage.setItem(CURRENT_KEY, t.dataset.test); } catch (e) { /* ignore */ } location.hash = "#/"; location.reload(); return; }
    if (t.dataset.speak) { speak(t.dataset.speak); return; }
    if (t.dataset.choice != null) return answerQ(+t.dataset.choice);
    if (t.hasAttribute("data-next")) return nextQ();
    if (t.dataset.pchoice != null) return answerPassage(+t.dataset.pchoice);
    if (t.hasAttribute("data-pgo")) return passageAdvance();
    if (t.hasAttribute("data-pnext")) { run.pIndex++; if (run.pIndex < run.passages.length) startPassage(); else showResult(); return; }
    if (t.hasAttribute("data-pja")) { run.pas.showJa = !run.pas.showJa; const y = window.scrollY; drawPassage(false); window.scrollTo(0, y); if (run.pas.cur < run.pas.blanks.length && !run.pas.done) { /* keep answered state */ } return; }
    if (t.dataset.toggle) {
      const body = $("#tabBody");
      if (t.dataset.toggle === "ja") { state.hideJa = !state.hideJa; body.classList.toggle("hide-ja", state.hideJa); t.setAttribute("aria-pressed", state.hideJa); $$(".jaw.show").forEach(x => x.classList.remove("show")); }
      else { state.hideChunks = !state.hideChunks; body.classList.toggle("hide-chunks", state.hideChunks); t.setAttribute("aria-pressed", !state.hideChunks); }
      save(); return;
    }
    if (t.hasAttribute("data-again")) { const r = run; if (r.mode === "lesson") startRun("lesson", r.L, r.step); else startRun(r.mode); return; }
    if (t.classList.contains("jaw")) { t.classList.toggle("show"); return; }
    if (t.id === "installNow" && deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; t.hidden = true; }
  });
  document.addEventListener("keydown", e => {
    if (!$("#sheet").hidden) { if (e.key === "Escape") $("#sheet").hidden = true; return; }
    if (!run || e.altKey || e.ctrlKey || e.metaKey) return;
    if (/^[1-4]$/.test(e.key)) {
      const sel = run.pas && !run.pas.done && $("[data-pchoice]") ? `[data-pchoice="${+e.key - 1}"]` : `[data-choice="${+e.key - 1}"]`;
      const b = $(sel); if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (e.key === "Enter") {
      const b = $("[data-next]") || $("[data-pgo]") || $("[data-pnext]");
      if (b && document.activeElement !== b) { e.preventDefault(); b.click(); }
    }
  });
  $("#installBtn").addEventListener("click", openInstall);
  $("#sheetClose").addEventListener("click", () => { $("#sheet").hidden = true; });
  $("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") $("#sheet").hidden = true; });
  $("#resetBtn").addEventListener("click", () => {
    if (confirm("このテスト対策の学習記録をすべて消します。よろしいですか？")) { state = { cleared: {}, best: {}, mistakes: [], hideJa: false, hideChunks: false, testBest: null }; save(); location.hash = "#/"; route(); }
  });
  $("#ver").textContent = "ver " + APP_VERSION;
  window.addEventListener("hashchange", route);

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  if (canSpeak && speechSynthesis.getVoices().length === 0) speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", () => {});

  load();
  route();
})();

</script>
</body>
</html>
